  - type: bullets
    eyebrow: "Lecture 4 · full circle — and over to your lab"
    title: "The through-line: fit the data, don't memorize it"
    bullets:
      - "The right loss scores the right thing; the knobs make training converge"
      - "The gap between training and validation loss tells you if it generalizes"
      - "Regularization (dropout, weight decay, early stopping, more data) shrinks that gap"
      - "Next: Lecture 5 gives deep nets a gradient highway (ResNet) and reads spectra with CNNs; Lab 2 puts all of today on real DRIAMS data"
    callout: {kind: plain, text: "Everything today serves one idea: fit the data + don't memorize it. If you can read a validation curve and name a fix, you can do every item on Quiz 4."}
    notes: >
      Close the hour. Tie the three parts into one through-line: the right loss
      scores the right thing (Part 1), the knobs make training actually converge
      (Part 2), and reading the training-vs-validation gap tells you whether the
      model generalizes, with regularization to shrink that gap (Part 3).
      Vanishing gradients set up Lecture 5's ResNet skip connection — the
      "gradient highway" — and the CNNs that read spectra directly; Lab 2 puts
      all of today to work on real DRIAMS resistance data, including the class-
      imbalance problem from Q5. Then a ten-minute break before Lecture 5.
