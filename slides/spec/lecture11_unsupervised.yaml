deck:
  title: "Lecture 11 · Learning Without (Many) Labels"
  eyebrow: "MSACL · DS301 Deep Learning · Segment 4 · Lecture 11"

slides:
  - type: title
    title: "Learning without (many) labels"
    subtitle: "Autoencoders · reconstruction error as a QC alarm · VAEs (points vs clouds) · self-supervised & DINO · the semi-supervised middle path"
    notes: >
      Monday afternoon, Segment 4 hour two, straight on from Lecture 10's
      "your data, your metrics." Here is the uncomfortable truth for a clinical
      lab: most of your data is UNLABELED — thousands of QC runs, spectra,
      chromatograms nobody ever annotated. This hour is about what you can still
      learn without labels. Four stops: (1) autoencoders — compress then
      reconstruct, and use the reconstruction error as an anomaly / QC score;
      (2) VAEs, intuitively — points vs. clouds, told entirely in pictures with
      NO derivation; (3) self-supervised learning — how foundation models
      pretrain by letting the data label itself (masking, contrastive, DINO);
      (4) semi-supervised in one slide — the "10,000 unlabeled + 100 labeled"
      pseudo-labeling middle path. The topic is conceptual, so the one numeric
      beat is reconstruction error: an MSE by hand, then a normal-vs-anomaly
      decision against a threshold — a straight callback to Lecture 10's
      sensitivity/specificity choice. Same interactive spine as every lecture:
      each I-do is followed by a you-do that IS a Quiz 11 item. Hand out Quiz 11
      now, blank; we hit all four items live — the two latent pictures (Q1), the
      four-way paradigm match (Q2), the reconstruction-error compute (Q3), and
      the DINO/contrastive "why must the views agree?" (Q4). Lab 4 next hour
      builds a VAE on real spectra, so everything here is the on-ramp.

  - type: bullets
    eyebrow: "Lecture 11 · where this hour goes"
    title: "Four stops, no labels required"
    bullets:
      - {text: "Autoencoders — compress → reconstruct; reconstruction error as an anomaly / QC score", time: "14 min"}
      - {text: "VAEs, intuitively — points vs. clouds; sample and interpolate; tell an AE latent from a VAE latent", time: "16 min"}
      - {text: "Self-supervised — the data labels itself: masking (BERT), contrastive, DINO", time: "17 min"}
      - {text: "Semi-supervised in one slide — pseudo-labeling, the 10,000 + 100 middle path; then Quiz 11", time: "13 min"}
    notes: >
      Signpost the four stops so the room can pace itself. Nothing here needs
      new math: the only arithmetic all hour is one mean-squared-error, computed
      by hand, which most of this room already knows from assay QC. Everything is
      anchored to mass-spec: an autoencoder that flags a bad run, a latent map of
      your spectra, a VAE that morphs one spectrum into another, a model that
      pretrains by masking peaks. The back half — self-supervised learning — is
      the "how do the big foundation models actually learn without labels" story,
      a callback to Lecture 8's BERT and a preview of Lecture 13. Aim for a
      hands-on beat about every 8–10 minutes; the compute beat is Q3
      (reconstruction error), the rest are read-the-picture you-dos.

  - type: image
    eyebrow: "Autoencoders · compress → reconstruct · I-do"
    title: "An autoencoder squeezes, then rebuilds"
    image: img/autoencoder_schema.png
    img_h: 4.2
    caption: "canonical autoencoder: input x → code z → reconstruction x′ · diagram: Michela Massi, Wikimedia Commons, CC BY-SA 4.0"
    callout: {kind: plain, text: "An autoencoder has two halves. The ENCODER squeezes the input down to a tiny latent code z; the DECODER rebuilds the input from just that code. It is trained with NO labels — the target is the input itself, so it learns to make output ≈ input. The squeeze is the whole point: forced through a narrow code, the network can only keep what matters."}
    notes: >
      Open the autoencoder with the canonical picture (rule 7 — a real,
      CC BY-SA licensed diagram, credited). Read it left to right: the input x
      (here a generic vector; for us, a spectrum) is compressed by the encoder
      into a small CODE z in the middle, then the decoder expands that code back
      out to a reconstruction x′. The training signal is unusual and the key to
      the whole lecture: there is no human label — the network's target is its
      own input, so it simply tries to copy the input to the output. The catch is
      the bottleneck. Because everything must pass through a code far smaller than
      the input, the network cannot just memorize; it has to learn a compact
      representation that keeps the important structure and throws away noise.
      That single idea — compress then reconstruct — powers all three lab uses we
      care about: denoising (rebuild a clean version), dimensionality reduction
      (the code is a compact summary), and anomaly detection (next). Next slide,
      the same picture MS-anchored, with the latent code as a map of your spectra.

  - type: image
    eyebrow: "Autoencoders · the bottleneck · I-do"
    title: "The bottleneck: a spectrum in, a spectrum out"
    image: img/fig_ae_bottleneck.png
    img_h: 4.4
    callout: {kind: ms, text: "MS anchor: the input is a spectrum (thousands of intensities); the latent code z is just 2–3 numbers; the decoder rebuilds the spectrum from those. Two payoffs: z is a compact MAP coordinate for each spectrum (dimensionality reduction — plot the map, cluster it), and 'how well does it rebuild?' becomes a score we can threshold."}
    notes: >
      The same autoencoder, now drawn as an hourglass of neurons and MS-anchored.
      The wide input layer is a spectrum — thousands of intensity bins; the
      network squeezes it through a 2–3 number latent code and rebuilds it on the
      right. Land two payoffs the room will use. First, DIMENSIONALITY REDUCTION:
      the latent code is a tiny coordinate that summarizes an entire spectrum, so
      plotting every spectrum's code gives a 2-D MAP of your dataset — nearby
      points are similar spectra, and you can eyeball clusters (this is the "latent
      space as a map of your spectra" outcome, and it's what Lab 4 plots). Second,
      and the star of the next three slides: because the network only rebuilds
      well what it has seen before, the QUALITY of the reconstruction is itself an
      informative number. Train on good runs, and anything it rebuilds badly is
      suspicious. That is reconstruction error, coming up as an anomaly score.

  - type: image
    eyebrow: "Autoencoders · reconstruction error as a QC alarm · I-do"
    title: "Rebuild it badly → flag it"
    image: img/fig_anomaly_overlay.png
    img_h: 4.4
    callout: {kind: ms, text: "Train the autoencoder ONLY on good QC runs. A normal run (left) reconstructs almost perfectly — small gap, LOW error → pass. An abnormal run with a contaminant peak (right) the model never learned to rebuild — big red gap, HIGH error → FLAG. Reconstruction error is an unsupervised anomaly / QC alarm."}
    notes: >
      This is the money slide for a clinical lab (rule 2). The trick: train the
      autoencoder ONLY on known-good runs. Now it is an expert at rebuilding
      normal spectra and clueless about anything else. Feed it a normal QC run
      (left panel): the reconstruction (amber dashed) lands right on top of the
      measurement (teal) — a small gap, LOW reconstruction error, so it passes.
      Feed it an abnormal run (right panel) — here an extra contaminant peak the
      model has never seen — and it rebuilds a "normal-shaped" spectrum that
      misses the contaminant entirely; the red shaded gap is large, the
      reconstruction error is HIGH, and we FLAG the run for a human. No labels
      were needed: "abnormal" is simply "the model can't rebuild it." This is
      exactly Discussion D4 from last hour — would reconstruction error catch a
      bad run before a human does? Next slide we turn "how big is the gap" into a
      single number and a decision.

  - type: image
    eyebrow: "Autoencoders · reconstruction error, worked · I-do"
    title: "Reconstruction error = MSE, by hand"
    image: img/fig_recon_error_ido.png
    img_h: 4.5
    callout: {kind: ms, text: "One number for the whole gap: MSE = (1/n) Σ (xᵢ − x̂ᵢ)². Here x = (0.2, 0.5, 0.1), x̂ = (0.2, 0.4, 0.1). Squared errors: 0, 0.01, 0 → sum 0.01 → MSE = 0.01 / 3 = 0.0033. With a QC threshold of 0.01: 0.0033 < 0.01 → NORMAL (pass). Same threshold idea as Lecture 10's sensitivity/specificity call."}
    notes: >
      The one numeric mechanic of the hour (rule 6), and the formula the you-do
      needs ON THE DECK first (rule 3). Reconstruction error collapses the whole
      gap between a spectrum and its rebuild into ONE number: the mean squared
      error, MSE = (1/n) Σ (xᵢ − x̂ᵢ)². Work the tiny 3-bin example live. Bin by
      bin: bin 1, 0.2 − 0.2 = 0, squared 0; bin 2, 0.5 − 0.4 = 0.1, squared 0.01;
      bin 3, 0.1 − 0.1 = 0, squared 0. Sum of squared errors = 0.01; divide by
      n = 3 → MSE = 0.01 / 3 = 0.0033 (exact, a repeating 0.00333…). Now the
      DECISION, which is the QC alarm: we set a threshold on normal runs — say
      0.01 — and flag anything above it. 0.0033 < 0.01, so this run is NORMAL and
      passes. Emphasize the callback: choosing that threshold is precisely the
      sensitivity/specificity trade-off from Lecture 10 — lower it to catch more
      anomalies (higher sensitivity, more false alarms), raise it to reduce false
      alarms (higher specificity). Next slide the room computes a fresh one — the
      Quiz 11 Q3 numbers.

  - type: image
    eyebrow: "Autoencoders · your turn (you-do = Q3)"
    title: "Your turn — compute the error, make the call"
    image: img/fig_recon_error_youdo.png
    img_h: 4.5
    callout: {kind: check, text: "Your turn → Quiz 11, Q3. Same formula, new numbers: x = (0.1, 0.8, 0.2), x̂ = (0.1, 0.5, 0.2), threshold 0.01. Compute each squared error, then the MSE, then decide: normal or anomaly? Worked answer in the notes."}
    notes: >
      YOU-DO = Quiz 11 Q3 (the same MSE-then-threshold skill, new numbers; this
      is the hour's compute beat and it assesses the reconstruction-error
      outcome). Work it exactly: bin 1, 0.1 − 0.1 = 0, squared 0; bin 2,
      0.8 − 0.5 = 0.3, squared 0.09; bin 3, 0.2 − 0.2 = 0, squared 0. Sum of
      squared errors = 0.09; MSE = 0.09 / 3 = 0.03. Decision against the stated
      threshold 0.01: 0.03 > 0.01 → ANOMALY, flag the run. Every number is exact
      and identical to the Quiz 11 Q3 figure and answer key. Contrast it with the
      I-do: same formula, but this run's single big mismatch (0.8 measured vs 0.5
      rebuilt) pushes the error over the line. Take the MSE from the floor,
      confirm the call, then have them fill Q3.

  - type: image
    eyebrow: "VAEs · points vs clouds · I-do"
    title: "AE vs VAE: scattered islands vs a smooth cloud"
    image: img/fig_ae_vs_vae_latent.png
    img_h: 4.6
    callout: {kind: plain, text: "Same spectra, two latent maps. AE (left): each spectrum is memorized as an isolated point — tight islands with big EMPTY GAPS between them; decode a point in a gap and you get garbage. VAE (right): one smooth, organised, gap-free CLOUD — every point decodes to a plausible spectrum, so you can SAMPLE new spectra and INTERPOLATE between real ones."}
    notes: >
      The heart of the VAE, told as points vs. clouds — NO math (rule 9). Plot the
      same spectra in an autoencoder's latent space (left) and a VAE's (right).
      The plain autoencoder tends to scatter its training spectra into tight,
      separated ISLANDS with large empty regions between them — it has essentially
      memorized each example as a point and left the space between undefined;
      decode a latent point that falls in one of those gaps and the decoder,
      never trained there, emits garbage. A VAE is trained to do the same
      reconstruction PLUS keep its latent codes packed into one smooth, centered,
      gap-free CLOUD. Because the cloud has no holes, EVERY point in it decodes to
      a plausible spectrum — which unlocks two abilities the AE lacks: you can
      SAMPLE a new latent point and get a brand-new realistic spectrum, and you
      can walk between two real spectra and get a smooth morph (next slides). The
      single visual test the quiz asks: gaps and islands = AE; one smooth
      organized cloud = VAE. Next, the recipe that produces that tidy cloud, then
      the interpolation payoff, then the room makes the call.

  - type: image
    eyebrow: "VAEs · the recipe · I-do"
    title: "The VAE recipe: reconstruct + keep the cloud tidy"
    image: img/fig_vae_recipe.png
    img_h: 4.0
    callout: {kind: plain, text: "Two ingredients, no derivation. (1) Reconstruction — output ≈ input, same as an autoencoder. (2) A 'keep the cloud tidy' penalty — pull every code toward one neat, centered blob so no gaps open up. Balance the two and you get a smooth, sampleable, interpolatable latent. (In Lab 4 that tidiness term is the KL weight you tune.)"}
    notes: >
      The VAE recipe in one picture, deliberately NO derivation (the outcome says
      "explain intuitively", and the audience has no calculus). A VAE's loss is
      just two ingredients added together. INGREDIENT ONE is reconstruction —
      output ≈ input — identical to a plain autoencoder, and it's what keeps the
      spectra faithful. INGREDIENT TWO is a "keep the cloud tidy" penalty: it
      gently pulls every latent code toward one neat, centered blob, so the codes
      pack together with no empty gaps. That second term is the ONLY difference
      from an autoencoder, and it's what turns scattered islands into a smooth
      cloud. There's a tension the room will meet in Lab 4: crank the tidiness
      term too high and the codes all collapse to the center and reconstructions
      go blurry; too low and you're back to an autoencoder with gaps. Name the
      term for Lab 4 — it's the "KL weight" — but do NOT write the KL formula;
      the equalizer intuition (reconstruct vs. tidy) is all they need. Next, the
      payoff of the smooth cloud: interpolation.

  - type: image
    eyebrow: "VAEs · interpolation · I-do"
    title: "Walk a line → one spectrum morphs into another"
    image: img/fig_latent_interp.png
    img_h: 4.6
    callout: {kind: ms, text: "Pick two real spectra, A and B, find their latent codes, and walk a straight line between them. Decoding each stop gives a smooth MORPH — peaks slide and swap height from A into B. This only works because the VAE cloud is gap-free: every stop on the line is a valid, plausible spectrum. An AE's gaps would decode to garbage partway across.  💬 30 sec with your neighbor: walking stop 1 (A) → stop 5 (B), does the LEFT peak grow or shrink? (Answer in notes: it shrinks, 1.0 → 0.4, smoothly — every stop is a valid spectrum.)"}
    notes: >
      The fun payoff and the clearest proof the cloud is smooth. Take two real
      spectra, A and B; encode each to its latent code; then walk a straight line
      between those two codes and decode a handful of stops along the way. The
      decoded spectra MORPH continuously — peaks slide in m/z and trade height as
      you move from A to B — a smooth interpolation, not an abrupt switch. The
      teaching point: this is only possible because the VAE's latent cloud is
      gap-free, so every intermediate point on the line is a valid, plausible
      spectrum. Try the same walk in a plain autoencoder's latent space and
      somewhere in the middle you cross an empty gap the decoder was never
      trained on, and out comes garbage. This is exactly the Lab 4 "fun payoff"
      cell — sample latent points and interpolate between two spectra — so it's a
      direct preview. 💬 DO-IT-TOGETHER (30 sec, to break the VAE stretch):
      walking stop 1 → stop 5, the LEFT peak SHRINKS — it starts tall at stop 1
      (spectrum A) and is clearly lower by stop 5 (spectrum B), while the middle
      peak rises; that continuous trade of peak heights IS the smooth morph the
      gap-free cloud buys you. Take the call, then next slide the room
      makes the AE-vs-VAE identification itself (Quiz 11 Q1).

  - type: image
    eyebrow: "VAEs · your turn (you-do = Q1) · 💬 pair"
    title: "Which picture is the VAE?"
    image: img/fig_latent_ab_quiz.png
    img_h: 4.6
    callout: {kind: check, text: "Your turn → Quiz 11, Q1. Two latent maps of the same spectra. Which one is the VAE — and justify in ONE sentence. 💬 With your neighbor: which map would you trust to flag a NOVEL contaminant, and why? Worked answer in the notes."}
    notes: >
      YOU-DO = Quiz 11 Q1 (tell an AE latent from a VAE latent in a picture — the
      VAE outcome, assessed). Answer: PICTURE B is the VAE. One-sentence
      justification (any equivalent): B is one smooth, organized, gap-free cloud
      where every point decodes to a plausible spectrum, whereas Picture A is
      scattered islands with big empty gaps that would decode to garbage — the
      autoencoder. Run the 💬 pair prompt from the outcomes: which map would you
      trust to flag a NOVEL contaminant? The VAE cloud (B) — a genuinely new
      spectrum lands OUTSIDE the tidy cloud (high reconstruction error, easy to
      flag), while the AE's gaps make "far from training data" ambiguous. Both
      pictures are reproduced verbatim on the Quiz 11 sheet, so the room answers
      straight off this slide. Take one answer with its reason, then have them
      fill Q1.

  - type: title
    eyebrow: "Lecture 11 · part three"
    title: "Self-supervised learning — the data labels itself"
    subtitle: "how the big foundation models pretrain without a single human label"
    notes: >
      Pivot to the idea behind every modern foundation model. So far, autoencoders
      and VAEs learned without labels by reconstructing their input. Self-supervised
      learning generalizes that trick: invent a "pretext" task where the ANSWER is
      already hidden in the data, so the data supplies its own labels for free.
      Train a big model on millions of unlabeled examples that way and its body
      learns general-purpose features — then fine-tune a small head on your few
      hundred labels (Lecture 8's transfer learning). This is how BERT, GPT, the
      protein language models, and the DINO vision models are all pretrained.
      Three flavors coming up: masking (the BERT callback), contrastive learning,
      and DINO's student–teacher self-distillation — each one anchored to spectra.

  - type: image
    eyebrow: "Self-supervised · masking (BERT) · I-do"
    title: "Masking: hide a piece, predict it"
    image: img/fig_masking.png
    img_h: 4.0
    callout: {kind: ms, text: "The BERT trick (Lecture 8), now a pretext task: hide part of the input and make the model predict it from context. Mask a residue in a peptide (A–C–?–E–F–G → predict D), or a peak in a spectrum. No human labels — the hidden token IS the answer. Do this on millions of unlabeled sequences and the body learns real structure."}
    notes: >
      The first self-supervised flavor, and a direct callback to Lecture 8's BERT.
      The pretext task: take an unlabeled sequence, hide a piece of it, and train
      the model to fill in the blank from the surrounding context. On a peptide,
      mask a residue — A–C–[MASK]–E–F–G — and predict the missing D; on a
      spectrum, mask a peak or a region and predict it back. The label was never
      supplied by a human — it's just the token you hid, so any pile of unlabeled
      data becomes training data. Run this over millions of unlabeled sequences or
      spectra and the model is forced to learn genuine structure (which residues
      co-occur, what a real peak pattern looks like) to succeed — exactly the
      general features you then transfer. This is precisely how BERT pretrained on
      text and how protein language models like ESM-2 (Lab 3's bonus) pretrained
      on sequences. Next, a different self-supervised idea: agreement between two
      views.

  - type: image
    eyebrow: "Self-supervised · contrastive · I-do"
    title: "Contrastive: two views should land together"
    image: img/fig_contrastive.png
    img_h: 4.4
    callout: {kind: ms, text: "Make two augmented VIEWS of the same spectrum — add noise, shift m/z. They're still the same sample, so their embeddings should land TOGETHER (pull), while a different spectrum is pushed APART. The label is simply 'same source or not' — no human needed. The model learns features that ignore nuisance augmentations."}
    notes: >
      The second self-supervised flavor: contrastive learning. Take one spectrum
      and make two AUGMENTED views of it — add intensity noise for one, shift the
      m/z axis slightly for the other (exactly the Lab 2 augmentations). Both views
      still come from the same physical sample, so the model should map them to
      NEARBY points in embedding space — "pull together" — while a view of a
      DIFFERENT spectrum is pushed apart. The self-supervised label is just "did
      these two come from the same source?", which you know for free because YOU
      made the augmentations. By insisting that augmented views agree, the model
      is forced to learn features that capture the real content and IGNORE the
      nuisance variation (noise, small shifts) — which is precisely the
      augmentation-invariance you want for robust spectra. This "views must agree"
      idea is the core of Quiz 11 Q4, and it sets up DINO, which takes the same
      agreement principle and adds a teacher.

  - type: image
    eyebrow: "Self-supervised · DINO · I-do"
    title: "DINO: a student learns to match a teacher"
    image: img/fig_dino.png
    img_h: 4.4
    caption: "student–teacher self-distillation; the object-segmentation panel is an illustrative schematic of the DINO attention result (Caron et al. 2021, Meta AI, code Apache-2.0)"
    callout: {kind: plain, text: "DINO = self-distillation with no labels. Two augmented views of one input go to a STUDENT and a TEACHER network; the student is trained so its output MATCHES the teacher's, and the teacher is just a slow moving average of the student. Same 'augmented views must agree' idea — and the famous payoff: attention learns to segment the object with no labels at all."}
    notes: >
      The third self-supervised flavor and the one with the striking visual: DINO
      (self-DIstillation with NO labels, Caron et al. 2021). It runs on the same
      "two views must agree" principle as contrastive learning, packaged as a
      student and a teacher. Two augmented views of one input are fed to a STUDENT
      network and a TEACHER network; the student is trained so its output
      distribution MATCHES the teacher's on the same input. Where does the teacher
      come from with no labels? It IS the student — a slow moving average of the
      student's own weights — so the model teaches itself, which is why it's called
      self-distillation. The famous, almost eerie payoff (right panel): after this
      label-free pretraining, the model's ATTENTION spontaneously highlights the
      main object in an image — unsupervised segmentation, no masks or boxes ever
      provided. For us the message is the through-line of the whole self-supervised
      section: augmentation-invariance — make different views of the same thing
      agree — plus scale is enough to learn powerful, general features without
      labels, which is how modern foundation models pretrain (forward to Lecture
      13). Next slide the room answers WHY the views must agree (Quiz 11 Q4).

  - type: image
    eyebrow: "Self-supervised · your turn (you-do = Q4)"
    title: "Your turn — why must the two views agree?"
    image: img/fig_contrastive.png
    img_h: 4.2
    callout: {kind: check, text: "Your turn → Quiz 11, Q4. Two augmented views of the SAME spectrum are forced to land together. In one sentence: WHY must they agree — what does that force the model to learn? Worked answer in the notes."}
    notes: >
      YOU-DO = Quiz 11 Q4 (the contrastive/DINO intuition; assesses the
      self-supervised outcome). Expected answer (any equivalent phrasing earns
      full credit): the two views differ only by nuisance augmentations — added
      noise, an m/z shift — while the underlying sample is identical, so forcing
      their embeddings to AGREE makes the model learn the stable, real content and
      IGNORE the nuisance variation (augmentation-invariance). A good extension:
      that invariance is exactly what you want for spectra, because the same
      sample on a different day or instrument should still land in the same place.
      And note the guardrail — the augmentations must preserve the biology; if a
      "view" changed the actual signal, forcing agreement would teach the model to
      ignore something real. Take one answer from the floor, then have them fill
      Q4. That's the third and fourth Quiz 11 items done — one more paradigm to
      name.

  - type: image
    eyebrow: "Semi-supervised · the middle path · I-do"
    title: "Semi-supervised: 10,000 unlabeled + 100 labeled"
    image: img/fig_pseudolabel.png
    img_h: 3.9
    callout: {kind: plain, text: "The realistic lab case: a FEW labeled examples and a MOUNTAIN of unlabeled ones. Pseudo-labeling bridges them — train on the 100, predict on the 10,000, KEEP the confident guesses as 'pseudo-labels', and retrain on the combined set. Named so you know the term (not deeper); it's the middle path between fully supervised and fully unsupervised."}
    notes: >
      The fourth and last paradigm, deliberately one slide and named-not-derived
      (per the outcomes). Real labs rarely have zero labels OR plenty — they have a
      FEW hundred labeled examples and thousands of unlabeled ones. Semi-supervised
      learning uses both. The workhorse recipe is PSEUDO-LABELING: train a first
      model on your 100 labeled spectra; use it to predict labels for the 10,000
      unlabeled ones; KEEP only the confident predictions as "pseudo-labels"; then
      retrain on the 100 real plus the confident pseudo-labeled examples, and
      optionally repeat. The unlabeled mountain, cheaply labeled by the model
      itself, pulls the decision boundary into better shape. The only goal here is
      that the room LEAVES knowing the term and where it sits — the middle path
      between fully supervised (Lectures 1–8) and fully unsupervised (autoencoders,
      today) — so when a vendor or paper says "semi-supervised," they know what it
      means. One honest caveat: confident-but-wrong pseudo-labels can reinforce a
      model's own mistakes, so the confidence filter matters. Next, put all four
      paradigms side by side for the match.

  - type: image
    eyebrow: "Paradigms · the matching chart · I-do"
    title: "Four paradigms, side by side"
    image: img/fig_paradigm_chart.png
    img_h: 4.9
    callout: {kind: ms, text: "Match the DATA YOU HAVE to a paradigm. SUPERVISED: many labeled → learn input→label. UNSUPERVISED: no labels → find structure / score anomalies (autoencoder QC). SELF-SUPERVISED: no labels, the data labels itself → pretext task pretrains a body (mask & predict). SEMI-SUPERVISED: few labeled + many unlabeled → pseudo-label the rest."}
    notes: >
      The single chart the Q2 four-way match is answerable from (rule 3). Walk the
      four rows by the ONE question that decides each: what data do you have?
      SUPERVISED — you have many LABELED examples, so learn a direct input→label
      map (every lecture so far; e.g. labeled spectra → resistant/susceptible).
      UNSUPERVISED — you have NO labels, so find structure or score anomalies
      (today's autoencoder flagging bad QC runs; clustering). SELF-SUPERVISED — no
      labels either, but the DATA LABELS ITSELF via a pretext task that pretrains a
      general body (mask peaks and predict, then fine-tune) — the foundation-model
      recipe. SEMI-SUPERVISED — you have FEW labels plus MANY unlabeled, so
      pseudo-label the rest and retrain. I-do one row aloud — the autoencoder QC
      case is unsupervised — then the room matches four scenarios off this same
      chart next slide (Quiz 11 Q2).

  - type: image
    eyebrow: "Paradigms · your turn (you-do = Q2)"
    title: "Your turn — match four scenarios"
    image: img/fig_paradigm_youdo.png
    img_h: 4.9
    callout: {kind: check, text: "Your turn → Quiz 11, Q2. Match each scenario to ONE paradigm (each used once): (a) 3,000 spectra each labeled S/R, train a classifier; (b) 50,000 unlabeled runs, flag the abnormal ones; (c) pretrain on millions of unlabeled spectra by masking peaks, then fine-tune; (d) 100 labeled + 10,000 unlabeled, label the rest and retrain. Worked answer in the notes."}
    notes: >
      YOU-DO = Quiz 11 Q2 (match four lab scenarios to the four paradigms; each
